name: GBA RP2350 routing

on:
  pull_request:
    paths:
      - 'gba-rp2350/**'
      - '.github/workflows/gba-rp2350-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gba-routing-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: gba-single-phase
            entry: placement-storage-gba-single-phase
          - candidate: gba-power-planes-clock-first
            entry: placement-storage-gba-power-planes-clock-first
          - candidate: gba-power-planes-global
            entry: placement-storage-gba-power-planes-global
    defaults:
      run:
        working-directory: gba-rp2350
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Record installed routing packages
        run: |
          bun -e 'for (const name of ["tscircuit", "@tscircuit/core", "@tscircuit/eval", "@tscircuit/capacity-autorouter", "@tscircuit/copper-pour-solver"]) console.log(name, JSON.parse(await Bun.file(`node_modules/${name}/package.json`).text()).version)'
      - name: Typecheck candidate sources
        run: bunx --no-install tsc --noEmit
      - name: Route full board with Pipeline 9
        env:
          ENTRY: ${{ matrix.entry }}
        run: |
          mkdir -p reports
          bunx --no-install tsci build "experiments/fabrication/${ENTRY}.circuit.tsx" --autorouter-timeout 40m --autorouter-debug --autorouter-dump-srj all --pcb-svgs 2>&1 | tee reports/routing.log
      - name: Record all errors and electrical identity
        id: report
        if: always()
        env:
          ENTRY: ${{ matrix.entry }}
        run: bun checks/route-report.ts "dist/experiments/fabrication/${ENTRY}/circuit.json" reports/route.json
      - name: Verify storage netlist and imported parts
        if: always()
        env:
          ENTRY: ${{ matrix.entry }}
        run: bun checks/verify-storage.ts "dist/experiments/fabrication/${ENTRY}/circuit.json" 2>&1 | tee reports/storage.log
      - name: Gerber shorts at 50 pixels per mm
        id: shorts50
        if: always() && steps.report.outputs.route_ready == 'true'
        env:
          ENTRY: ${{ matrix.entry }}
        run: bunx --no-install tsci check shorts "dist/experiments/fabrication/${ENTRY}/circuit.json" --mode gerber --layer all --pixels-per-mm 50 2>&1 | tee reports/shorts-50.log
      - name: Preserve 50-pixel shorts images
        if: always()
        run: |
          if [ -d checks/check-shorts ]; then
            mv checks/check-shorts reports/shorts-50
          fi
      - name: Gerber shorts at 100 pixels per mm
        if: always() && steps.report.outputs.route_ready == 'true' && steps.shorts50.outcome == 'success'
        env:
          ENTRY: ${{ matrix.entry }}
        run: |
          for layer in top inner1 inner2 bottom; do
            bunx --no-install tsci check shorts "dist/experiments/fabrication/${ENTRY}/circuit.json" --mode gerber --layer "$layer" --pixels-per-mm 100 2>&1 | tee "reports/shorts-100-${layer}.log"
            if [ -d checks/check-shorts ]; then
              mv checks/check-shorts "reports/shorts-100-${layer}"
            fi
          done
      - name: Preserve 100-pixel shorts images
        if: always()
        run: |
          if [ -d checks/check-shorts ]; then
            mv checks/check-shorts reports/shorts-100
          fi
      - name: Require zero reported errors and critical warnings
        if: always()
        run: bun checks/route-gate.ts reports/route.json
      - name: Preserve routing evidence
        if: always()
        # Route reports are already printed in the log; artifact quota should not mask routing results.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gba-routing-${{ matrix.candidate }}
          path: |
            gba-rp2350/reports
            gba-rp2350/dist/experiments/fabrication/${{ matrix.entry }}
          if-no-files-found: warn
          retention-days: 14
