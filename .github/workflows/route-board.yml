name: Route and verify Game Boy board

on:
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      public_registry_validation:
        description: Route public Game Boy with explicit phases/manual paths in published tscircuit 0.0.2707
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  route-and-verify:
    if: ${{ !inputs.public_registry_validation }}
    name: Pipeline 9 route, DRC, and shorts checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Route board and generate review images
        id: route
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          bunx --no-install tsci build index.circuit.tsx \
            --pcb-svgs --schematic-svgs --pcb-png --schematic-png \
            --autorouter-timeout 25m --autorouter-debug \
            --autorouter-dump-srj failed \
            2>&1 | tee artifacts/route.log

      - name: Inventory generated DRCs
        id: drc
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          test -f dist/index/circuit.json
          bun run report:drc -- dist/index/circuit.json artifacts/drc-report.json \
            2>&1 | tee artifacts/drc-report.log

      - name: Validate source and netlist
        id: source-netlist
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            bunx --no-install tsci check source index.circuit.tsx
            bunx --no-install tsci check netlist index.circuit.tsx
          } 2>&1 | tee artifacts/source-netlist.log

      - name: Detect unintended PCB shorts
        id: shorts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run check:shorts 2>&1 | tee artifacts/shorts.log

      - name: Upload routed board and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-routing-${{ github.sha }}
          if-no-files-found: warn
          path: |
            dist/
            artifacts/

      - name: Fail if routing or electrical checks failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.route.outcome }}" = "success"
          test "${{ steps.drc.outcome }}" = "success"
          test "${{ steps.source-netlist.outcome }}" = "success"
          test "${{ steps.shorts.outcome }}" = "success"

  route-public-registry-release:
    if: ${{ inputs.public_registry_validation }}
    name: Public source, published tscircuit worker, native PCB snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ci-public-route
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the published tscircuit package
        run: bun install
      - name: Install the browser runtime for the published worker
        run: bunx --no-install playwright install --with-deps chromium
      - name: Route public source and save native PCB image
        run: |
          set -o pipefail
          mkdir -p artifacts
          timeout --signal=TERM 25m bun run route.ts 2>&1 | tee artifacts/route.log
      - name: Upload evidence even on routing or DRC failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phased-gameboy-tscircuit-2707
          if-no-files-found: warn
          path: |
            ci-public-route/artifacts/
            ci-public-route/bun.lock
            ci-public-route/package.json
